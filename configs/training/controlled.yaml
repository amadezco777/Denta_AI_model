# Nuevo experimento: no sustituye a la referencia historica baseline.yaml.
model: models/pretrained/yolo11n.pt
data: data/processed/master/dataset.yaml
dataset_lock: configs/data/contracts/master.lock.json
deterministic: true
seeds: [42]
project: runs/controlled
name: yolo11n_640_adamw_no_mosaic
train:
  epochs: 50
  batch: 8
  amp: false
  imgsz: 640
  device: 0
  workers: 4
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  patience: 20
  fliplr: 0.5
  flipud: 0.0
  degrees: 5.0
  scale: 0.2
  translate: 0.1
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.2
  mosaic: 0.0
  mixup: 0.0
  copy_paste: 0.0
  close_mosaic: 0
