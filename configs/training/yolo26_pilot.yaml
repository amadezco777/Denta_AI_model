# Piloto economico: medir segundos/epoca y VRAM antes de una corrida completa.
model: yolo26n.pt
data: data/processed/labelstudio_reviewed/dataset/dataset.yaml
dataset_lock: configs/data/contracts/labelstudio_reviewed.lock.json
deterministic: true
seeds: [42]
project: runs/yolo26
name: yolo26n_pilot_640
train:
  epochs: 3
  imgsz: 640
  batch: 4
  device: 0
  workers: 0
  amp: false
  cache: false
  optimizer: AdamW
  lr0: 0.001
  weight_decay: 0.0005
  patience: 0
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.2
  fliplr: 0.5
  flipud: 0.0
  degrees: 5.0
  scale: 0.2
  mosaic: 0.0
  mixup: 0.0
  copy_paste: 0.0
  close_mosaic: 0
  val: true
  save: true
  save_period: 1
